name: CI - AI Culture Guardian (Bend Engine & Angular Dashboard)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-bend-and-culture:
    name: Bend Engine, Angular Frontend & Culture Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & Bend
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bend
            ~/.cargo/bin/hvm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bend-

      - name: Install Bend and HVM
        run: |
          if ! command -v bend &> /dev/null; then
            cargo install bend-lang hvm
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Full Validation Suite (Bend + Angular + CLI)
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: Run Blocker Verification Test on Non-Compliant Code
        run: |
          echo "Verificando se o Gate bloqueia código com violações P0..."
          if python3 scripts/culture_guard.py examples/non_compliant_agent_output.py; then
            echo "Erro: Código não-conforme foi incorretamente aprovado!"
            exit 1
          else
            echo "Sucesso: Código não-conforme foi bloqueado corretamente pelo guardião de cultura."
          fi
